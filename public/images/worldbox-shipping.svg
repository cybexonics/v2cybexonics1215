<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128" />
      <stop offset="50%" stop-color="#101f42" />
      <stop offset="100%" stop-color="#0d1b2a" />
    </linearGradient>
    <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.35" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bg)" />
  <rect width="800" height="480" fill="url(#grid)" />

  <!-- World map dotted route arches -->
  <path d="M 90 280 Q 240 140 420 220 T 710 180" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,6" opacity="0.4" />
  <path d="M 120 320 Q 320 180 500 290 T 730 250" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.3" />

  <!-- Node points -->
  <circle cx="90" cy="280" r="5" fill="#38bdf8" />
  <circle cx="420" cy="220" r="6" fill="#ef4444" />
  <circle cx="710" cy="180" r="5" fill="#38bdf8" />

  <!-- Left Side: Worldbox Badge & Logistics Graphic -->
  <g transform="translate(60, 60)">
    <!-- Brand Box -->
    <rect width="280" height="74" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <!-- Red Cube Icon -->
    <g transform="translate(18, 16)">
      <polygon points="20,2 38,12 20,22 2,12" fill="#ef4444" />
      <polygon points="2,12 20,22 20,40 2,30" fill="#dc2626" />
      <polygon points="38,12 20,22 20,40 38,30" fill="#991b1b" />
    </g>
    <text x="68" y="32" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="16" letter-spacing="1.5">WORLDBOX</text>
    <text x="68" y="52" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="11" letter-spacing="2">SHIPPING PVT. LTD.</text>
  </g>

  <!-- Central Cargo Ship / Freight Silhouette -->
  <g transform="translate(60, 165)" opacity="0.95">
    <!-- Ship Hull -->
    <path d="M 20 160 L 50 200 L 270 200 L 320 160 Z" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <path d="M 50 200 L 60 215 L 260 215 L 270 200 Z" fill="#0f172a" />
    <!-- Sea water waves -->
    <path d="M 0 215 C 30 210, 60 220, 90 215 C 120 210, 150 220, 180 215 C 210 210, 240 220, 270 215 C 300 210, 330 220, 360 215" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6" />
    <!-- Cargo Containers -->
    <rect x="70" y="130" width="38" height="28" rx="2" fill="#ef4444" stroke="#dc2626" stroke-width="1" />
    <rect x="112" y="130" width="38" height="28" rx="2" fill="#0284c7" stroke="#0369a1" stroke-width="1" />
    <rect x="154" y="130" width="38" height="28" rx="2" fill="#eab308" stroke="#ca8a04" stroke-width="1" />
    <rect x="196" y="130" width="38" height="28" rx="2" fill="#ef4444" stroke="#dc2626" stroke-width="1" />
    <!-- Second tier containers -->
    <rect x="91" y="98" width="38" height="28" rx="2" fill="#0284c7" stroke="#0369a1" stroke-width="1" />
    <rect x="133" y="98" width="38" height="28" rx="2" fill="#ef4444" stroke="#dc2626" stroke-width="1" />
    <rect x="175" y="98" width="38" height="28" rx="2" fill="#10b981" stroke="#059669" stroke-width="1" />
    <!-- Ship bridge -->
    <rect x="238" y="105" width="40" height="52" rx="3" fill="#334155" />
    <rect x="245" y="112" width="26" height="8" rx="1" fill="#38bdf8" opacity="0.8" />
    <line x1="258" y1="105" x2="258" y2="82" stroke="#64748b" stroke-width="2" />
    <circle cx="258" cy="80" r="3" fill="#ef4444" />
  </g>

  <!-- Right Side: SEO Retainer Dashboard Cards -->
  <g transform="translate(420, 60)">
    <!-- Main SEO Analytics Card -->
    <rect width="320" height="350" rx="16" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5" />

    <!-- Card Header -->
    <text x="24" y="38" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="16">SEO Retainer Analytics</text>
    <text x="24" y="58" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12">Freight &amp; Logistics Search Visibility</text>

    <rect x="220" y="24" width="76" height="24" rx="12" fill="#15803d" fill-opacity="0.25" stroke="#22c55e" stroke-width="1" />
    <text x="258" y="40" fill="#4ade80" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="11" text-anchor="middle">ACTIVE</text>

    <!-- Stat Metric 1: Organic Growth -->
    <g transform="translate(24, 80)">
      <rect width="128" height="68" rx="10" fill="#0f172a" stroke="#1e293b" />
      <text x="14" y="26" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Organic Traffic</text>
      <text x="14" y="50" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="18">+164%</text>
      <path d="M 94 48 L 102 38 L 110 42 L 120 32" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Stat Metric 2: Keyword Rankings -->
    <g transform="translate(168, 80)">
      <rect width="128" height="68" rx="10" fill="#0f172a" stroke="#1e293b" />
      <text x="14" y="26" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Top 10 Keywords</text>
      <text x="14" y="50" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="18">42 Rank #1</text>
    </g>

    <!-- Graph Visualization -->
    <g transform="translate(24, 168)">
      <rect width="272" height="100" rx="10" fill="#0f172a" stroke="#1e293b" />
      <!-- Grid lines inside graph -->
      <line x1="16" y1="30" x2="256" y2="30" stroke="#1e293b" stroke-width="1" stroke-dasharray="3,3" />
      <line x1="16" y1="60" x2="256" y2="60" stroke="#1e293b" stroke-width="1" stroke-dasharray="3,3" />
      <!-- Smooth Area Gradient -->
      <defs>
        <linearGradient id="graphGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ef4444" stop-opacity="0.45" />
          <stop offset="100%" stop-color="#ef4444" stop-opacity="0.0" />
        </linearGradient>
      </defs>
      <!-- Trend Area & Line -->
      <path d="M 20 80 Q 70 70, 110 52 T 180 34 T 252 18 L 252 85 L 20 85 Z" fill="url(#graphGrad)" />
      <path d="M 20 80 Q 70 70, 110 52 T 180 34 T 252 18" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" />
      <circle cx="252" cy="18" r="4" fill="#ffffff" stroke="#ef4444" stroke-width="2" />
    </g>

    <!-- Badges / Pillars -->
    <g transform="translate(24, 286)">
      <rect width="84" height="24" rx="12" fill="#1e293b" />
      <text x="42" y="16" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Logistics SEO</text>

      <rect x="92" y="0" width="86" height="24" rx="12" fill="#1e293b" />
      <text x="135" y="16" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Global Freight</text>

      <rect x="186" y="0" width="86" height="24" rx="12" fill="#1e293b" />
      <text x="229" y="16" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Lead Growth</text>
    </g>
  </g>
</svg>
