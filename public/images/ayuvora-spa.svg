      <text x="18" y="26" class="sans-font" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1">TODAY'S APPOINTMENTS</text>
      <text x="18" y="58" class="sans-font" font-size="28" font-weight="700" fill="#ffffff">28 <tspan font-size="14" font-weight="500" fill="#10b981">+18%</tspan></text>
