      <path d="M 14 12 C 14 12, 3 18, 3 23 C 3 26, 6 28, 10 27 C 12 25, 13 22, 14 12 Z" fill="#f59e0b" opacity="0.75" />
      <path d="M 14 12 C 14 12, 25 18, 25 23 C 25 26, 22 28, 18 27 C 16 25, 15 22, 14 12 Z" fill="#f59e0b" opacity="0.75" />
    </g>

    <!-- Brand Name -->
