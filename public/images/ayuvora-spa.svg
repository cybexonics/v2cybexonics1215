  <circle cx="150" cy="550" r="220" fill="#d97706" opacity="0.08" filter="url(#glow)" />

  <!-- Browser/App Header Bar -->
  <g id="top-nav" transform="translate(40, 25)">
    <rect width="1120" height="64" rx="14" fill="#11191f" stroke="#1f2c36" stroke-width="1.2" filter="url(#softShadow)" />
    
    <!-- Window Dots -->
